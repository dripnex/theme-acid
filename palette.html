<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Acid — palette</title>
<style>
:root {    --bg-base: #050805;
    --bg-surface: #0c140c;
    --bg-elevated: #142014;
    --bg-inset: #020402;
    --bg-hover: rgba(216, 255, 154, 0.06);
    --bg-active: rgba(216, 255, 154, 0.1);
    --text-primary: #d8ff9a;
    --text-secondary: rgba(216, 255, 154, 0.74);
    --text-muted: rgba(216, 255, 154, 0.52);
    --text-faint: rgba(216, 255, 154, 0.34);
    --border: rgba(216, 255, 154, 0.12);
    --border-subtle: rgba(216, 255, 154, 0.07);
    --border-strong: rgba(216, 255, 154, 0.18);
    --accent: #b8ff00;
    --accent-hover: #d0ff4a;
    --accent-muted: rgba(184, 255, 0, 0.2);
    --accent-subtle: rgba(184, 255, 0, 0.1);
    --glass-bg: rgba(5, 8, 5, 0.92);
    --glass-border: rgba(216, 255, 154, 0.1);
    --glass-bg-menu: rgba(20, 32, 20, 0.96);
    --glass-border-menu: rgba(216, 255, 154, 0.1);
    --status-active: #b8ff00;
    --status-on-hold: #e0c040;
    --status-completed: #7dff6a;
    --status-dropped: #ff5a5a;}
body{margin:0;background:var(--bg-base);color:var(--text-primary);font:16px/1.4 system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:40px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.chip{background:var(--bg-surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.swatch{height:72px}
.m{padding:10px}
code,span{display:block;color:var(--text-muted);font-size:12px;margin-top:4px;word-break:break-all}
</style></head><body><main>
<h1>Acid</h1><p style="color:var(--text-muted)">Hacker acid. Toxic lime on near-black.</p>
<div class="grid"><div class="chip"><div class="swatch" style="background:var(--bg-base)"></div><div class="m"><b>Base</b><code>--bg-base</code><span>#050805</span></div></div><div class="chip"><div class="swatch" style="background:var(--bg-surface)"></div><div class="m"><b>Surface</b><code>--bg-surface</code><span>#0c140c</span></div></div><div class="chip"><div class="swatch" style="background:var(--bg-elevated)"></div><div class="m"><b>Elevated</b><code>--bg-elevated</code><span>#142014</span></div></div><div class="chip"><div class="swatch" style="background:var(--text-primary)"></div><div class="m"><b>Text</b><code>--text-primary</code><span>#d8ff9a</span></div></div><div class="chip"><div class="swatch" style="background:var(--accent)"></div><div class="m"><b>Accent</b><code>--accent</code><span>#b8ff00</span></div></div><div class="chip"><div class="swatch" style="background:var(--status-active)"></div><div class="m"><b>Active</b><code>--status-active</code><span>#b8ff00</span></div></div><div class="chip"><div class="swatch" style="background:var(--status-on-hold)"></div><div class="m"><b>On hold</b><code>--status-on-hold</code><span>#e0c040</span></div></div><div class="chip"><div class="swatch" style="background:var(--status-dropped)"></div><div class="m"><b>Dropped</b><code>--status-dropped</code><span>#ff5a5a</span></div></div></div>
</main></body></html>
